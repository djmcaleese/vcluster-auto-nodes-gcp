apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: gcp-compute
spec:
  # Provider properties reach both the network environment and the node templates. project and
  # region have to live here (or on the NetworkEnvironment): the infrastructure template is passed
  # the merge of the provider's and the environment's properties only, never a node type's.
  properties:
    project: my-gcp-project
    region: us-east1
  terraform:
    networkEnvironmentTemplate:
      infrastructure:
        git:
          repository: https://github.com/loft-sh/vcluster-auto-nodes-gcp.git
          tag: v0.2.0
          subPath: environment/infrastructure
    nodeTemplate:
      git:
        repository: https://github.com/loft-sh/vcluster-auto-nodes-gcp.git
        tag: v0.2.0
        subPath: node
    # A provider with a networkEnvironmentTemplate places no nodes until a NetworkEnvironment
    # referencing it exists - see network_environment.example.yaml.
    nodeTypes:
    - name: e2-small
      resources:
        cpu: "2"
        memory: 2Gi
      properties:
        instance-type: e2-small
        # Zones the nodes of this type may land in. Drop it to let the provider's region decide.
        zone: "us-east1-b,us-east1-c,us-east1-d"
    - name: e2-medium
      resources:
        cpu: "2"
        memory: 4Gi
      properties:
        instance-type: e2-medium
        zone: "us-east1-b,us-east1-c,us-east1-d"
    - name: e2-standard-2
      resources:
        cpu: "2"
        memory: 8Gi
      properties:
        instance-type: e2-standard-2
        zone: "us-east1-b,us-east1-c,us-east1-d"
    - name: e2-standard-4
      resources:
        cpu: "4"
        memory: 16Gi
      properties:
        instance-type: e2-standard-4
        zone: "us-east1-b,us-east1-c,us-east1-d"
    - name: e2-standard-8
      resources:
        cpu: "8"
        memory: 32Gi
      properties:
        instance-type: e2-standard-8
        zone: "us-east1-b,us-east1-c,us-east1-d"
    - name: e2-standard-16
      resources:
        cpu: "16"
        memory: 64Gi
      properties:
        instance-type: e2-standard-16
        zone: "us-east1-b,us-east1-c,us-east1-d"
